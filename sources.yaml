sources:
  - id: mattpocock
    repo: https://github.com/mattpocock/skills
    ref: main
    subdir: skills
    discover: '*/*/SKILL.md'
    include:
      - diagnosing-bugs
      - grill-me
      - tdd
    overrides:
      grill-me:
        metadata:
          opencode/autoinvoke: false
          opencode/slash: true
  - id: cloudflare
    repo: https://github.com/cloudflare/security-audit-skill
    ref: main
    subdir: skills
    discover: '*/SKILL.md'
    # 两个 validate-*.test.cjs 是上游脚本的单测，SKILL.md 未引用
    ignore:
      - '*.test.cjs'
  - id: karpathy
    repo: https://github.com/Astro-Han/karpathy-llm-wiki
    ref: main
    # 单 skill 仓库：SKILL.md 在仓库根目录。tarball 解压目录带 SHA 后缀，
    # 用 name 显式固定 skill 名（否则发布名会随上游 commit 变化）。
    name: llm-wiki
    discover: SKILL.md
    # 根目录即 skill，仓库里的工程设施按路径剔除（build.py 的 ignore，
    # 支持目录前缀与 glob；* 可跨目录）
    ignore:
      - tests/
      - examples/
      - .gitignore
      - README.md
      - assets/
  - id: qingyun
    repo: https://github.com/QingYunA/answer-me-with-html
    ref: main
    subdir: skills
    discover: '*/SKILL.md'
